resource_key": "collection_9_png", "resource_version": 1073, "source_image": "media/resource-catalog/raw/41e299b6f995eb06409a7c403a1ab234dfd684c6bd11a76d6a5a93afcd50fd6c.png", "source_index": "media/resource-catalog/raw/1570fddac18d91e86543646a60c2c772811b5a764fd570e8ba4f7d3f5fae0dbc.json", "source_frame": {"x": 1287, "y": 541, "w": 226, "h": 171, "hw": 113, "hh": 85.5, "offX": 10, "offY": 31, "sourceW": 250, "sourceH": 250}, "linked_photos": [], "source_category": "图鉴", "ownership_source": "user_screenshots_and_confirmation_2026-09-09", "previous_text_annotation": {"official_name": null, "description": null, "location": null, "annotation_source": null}, "extended_description": "", "config_id": 3008, "text_source_table": "Item + Specialty", "text_resource_version": 1088}, {"id": "collection_1034_png", "category": "纪念品", "label": "纪念品 collection_1034", "official_name": "至正乙酉朱碧山造银槎杯", "description": "犹如扁舟的银酒杯 仙人乘舟似云端遨游", "location": "吴文化博物馆", "annotation_source": "static_config", "ownership": "not_obtained", "image_path": "media/resource-catalog/images/d5dee4413b4ab1a8905f1b35417529ce5a6dd11c9f4cb24968865c533a291e40.png", "width": 250, "height": 250, "hidden_reason": null, "resource_key": "collection_1034_png", "resource_version": 1073, "source_image": "media/resource-catalog/raw/41e299b6f995eb06409a7c403a1ab234dfd684c6bd11a76d6a5a93afcd50fd6c.png", "source_index": "media/resource-catalog/raw/1570fddac18d91e86543646a60c2c772811b5a764fd570e8ba4f7d3f5fae0dbc.json", "source_frame": {"x": 1056, "y": 749, "w": 225, "h": 170, "hw": 112.5, "hh": 85, "offX": 13, "offY": 40, "sourceW": 250, "sourceH": 250}, "linked_photos": [], "source_category": "图鉴", "ownership_source": "user_screenshots_and_confirmation_2026-09-09", "previous_text_annotation": {"official_name": null, "description": null, "location": null, "annotation_source": null}, "extended_description": "斜长22厘米、宽7.5厘米、高11.4厘米\n元代\n此器以仙人乘槎凌空飞越到达银河的神话故事为题材，将银酒杯巧制成树槎形的一叶扁舟，有一老人背靠槎尾而坐。槎背部有细瘦阴刻铭文“至正乙酉朱碧山造”，为元代银工朱碧山制作。\n这件作品设计精巧，造型奇特，在制作工艺上成功地运用了镂刻、焊等多种技法，结合圆雕、浮雕工艺将人与舟、舟与云气、人与槎树间的层次交待得既简练清晰又融为一体。人物镂刻生动逼真，面部丰颐宽额，隆准凤目，飘动的长须根根分明，细腻而流畅，达到了完美的艺术效果,属难得的工艺珍品。", "config_id": 49, "text_source_table": "Collection", "text_resource_version": 1088}, {"id": "collection_1044_png", "category": "纪念品", "label": "纪念品 collection_1044", "official_name": "虞弘墓石椁", "description": "做工奢华的石椁 所绘的浮雕精美绝伦", "location": "山西博物院", "annotation_source": "static_config", "ownership": "not_obtained", "image_path": "media/resource-catalog/images/4cda531369c407d8db3dbb79bdefabf95574eaad47b0b384cc75b77678c1f36a.png", "width": 250, "height": 250, "hidden_reason": null, "resource_key": "collection_1044_png", "resource_version": 1073, "source_image": "media/resource-catalog/raw/41e299b6f995eb06409a7c403a1ab234dfd684c6bd11a76d6a5a93afcd50fd6c.png", "source_index": "media/resource-catalog/raw/1570fddac18d91e86543646a60c2c772811b5a764fd570e8ba4f7d3f5fae0dbc.json", "source_frame": {"x": 344, "y": 812, "w": 221, "h": 148, "hw": 110.5, "hh": 74, "offX": 15, "offY": 62, "sourceW": 250, "sourceH": 250}, "linked_photos": [], "source_category": "图鉴", "ownership_source": "user_screenshots_and_confirmation_2026-09-09", "previous_text_annotation": {"official_name": null, "description": null, "location": null, "annotation_source": null}, "extended_description": "通高217厘米、通长295厘米、宽220 厘米\n隋代\n1999年 太原市王郭村开皇十二年(592年)虞弘墓出土\n整体呈仿木构三开间歇山顶房屋。汉白玉石，由底座、椁身、顶三部分组成，以及支撑石椁的石狮8件。石椁内外皆雕刻并施彩绘，由50多个单体图案组成，内容有宴饮、乐舞、射猎、家居、行旅等。图案中的人物深目高鼻黑发，属于地中海高加索人种，服饰、器皿、乐器、舞蹈及花草树木等，均具有浓厚的中亚和波斯风格，部分画面带有祆教的内容。展现了墓主人不同的文化背景，是研究中外文化交流的重要史料。虞弘是中亚鱼国人，北齐时入华，曾任职于北齐、北周和隋三个朝代。", "config_id": 53, "text_source_table": "Collection", "text_resource_version": 1088}, {"id": "collection_51_png", "category": "纪念品", "label": "纪念品 collection_51", "official_name": "京式月饼", "description": "宫廷风格的京式月饼 松软的表皮包裹着香甜的果仁", "location": "华北地区", "annotation_source": "static_config", "ownership": "obtained", "image_path": "media/resource-catalog/images/4909cb577ba35c0e6ecd3bb20d02e4d212a47f4f97b3e6de192734590b08 落，中高侧低，重檐庑殿屋顶，红柱琉璃瓦。庑殿顶正脊中间饰红色莲苞一株，复瓣座，圆苞蕊，两端各有一塑座狮吻。侧旁屋顶斜出三面，上置莲花座顶。仓顶四角均塑成卷云形。底层四周围以栏杆，每面中间均留通道开门，两侧对称布置。前后每侧为二栏相连，侧面每侧则一栏独立。立柱和栏杆串珠连成，柱杆间长方框内夹菱形连珠框，局部镂空通透。柱头莲花，前衬荷叶，杆中增饰如意云头。\n此仓之造型，前代未见，后世亦无，是目前仅见的重檐庑殿顶楼阁式谷仓，成为元代瓷器雕塑最高水平的代表之一。\n集青白釉、红釉、青花、釉里红四种高温釉（彩）于一器，为目前发现两件带纪年的元代青花釉里红器之一。\n此器谷仓冠名，墓志文字丰富，是研究地方历史、民俗文化的宝贵资料。", "config_id": 36, "text_source_table": "Collection", "text_resource_version": 1088}, {"id": "collection_1010_png", "category": "特产", "label": "特产 collection_1010", "official_name": "亚醜钺文创雪糕", "description": "有着奇特外形的雪糕 下嘴之前可能会忍不住一笑", "location": "山东博物馆", "annotation_source": "static_config", "ownership": "obtained", "image_path": "media/resource-catalog/images/b043337d7c5124e61a4a6e5e5f1e7969dce3638942e62431e3fef6d72d487498.png", "width": 250, "height": 250, "hidden_reason": null, "resource_key": "collection_1010_png", "resource_version": 1073, "source_image": "media/resource-catalog/raw/41e299b6f995eb06409a7c403a1ab234dfd684c6bd11a76d6a5a93afcd50fd6c.png", "source_index": "media/resource-catalog/raw/1570fddac18d91e86543646a60c2c772811b5a764fd570e8ba4f7d3f5fae0dbc.json", "source_frame": {"x": 409, "y": 1611, "w": 175, "h": 225, "hw": 87.5, "hh": 112.5, "offX": 34, "offY": 13, "sourceW": 250, "sourceH": 250}, "linked_photos": [], "source_category": "图鉴", "ownership_source": "user_screenshots_and_confirmation_2026-09-09", "previous_text_annotation": {"official_name": null, "description": null, "location": null, "annotation_source": null}, "extended_description": "", "config_id": 3030, "text_source_table": "Item + Specialty", "text_resource_version": 1088}, {"id": "collection_60_png", "category": "特产", "label": "特产 collection_60", "official_name": "烤冷面", "description": "口感柔韧有劲道的街头小吃 涂着酸甜香辣的酱汁", "location": "东北地区", "annotation_source": "static_config", "ownership": "obtained", "image_path": "media/resource-catalog/images/271fbe53e91eb22439874dbed7426f106a35f6f8d5a28f9c6472d728ea315703.png", "width": 250, "height": 250, "hidden_reason": null, "resource_key": "co 纪念品 collection_1021", "official_name": "透雕龙凤纹重环玉佩", "description": "精雕细镂的玉佩 光照中似乎有龙凤在游动", "location": "南越王博物院", "annotation_source": "static_config", "ownership": "not_obtained", "image_path": "media/resource-catalog/images/3853664815af8c34482d65d484b242ac81b9fcc6c94bc3419ee7df7e3ef6de62.png", "width": 250, "height": 250, "hidden_reason": null, "resource_key": "collection_1021_png", "resource_version": 1073, "source_image": "media/resource-catalog/raw/41e299b6f995eb06409a7c403a1ab234dfd684c6bd11a76d6a5a93afcd50fd6c.png", "source_index": "media/resource-catalog/raw/1570fddac18d91e86543646a60c2c772811b5a764fd570e8ba4f7d3f5fae0dbc.json", "source_frame": {"x": 1828, "y": 432, "w": 219, "h": 219, "hw": 109.5, "hh": 109.5, "offX": 16, "offY": 16, "sourceW": 250, "sourceH": 250}, "linked_photos": [], "source_category": "图鉴", "ownership_source": "user_screenshots_and_confirmation_2026-09-09", "previous_text_annotation": {"official_name": null, "description": null, "location": null, "annotation_source": null}, "extended_description": "直径10.6厘米，厚0.5厘米\n南越文王墓出土\n这件玉佩的名称已将特点概括其中。“透雕”指雕刻工艺，整块玉器主要使用透雕工艺镂空制成；“重环”指在设计上，玉佩分为内外两圈；“龙凤纹”是说内圈透雕一条游龙，前后爪与龙尾伸向外圈，外圈透雕一只凤鸟，站在龙的前爪之上，凤冠和尾羽上下延伸成卷云纹，把外圈空间填满，凤鸟回眸凝望游龙，龙凤似在喃喃细语，妙韵天成。\n这件玉佩雕镂精细，构思奇巧，将“龙凤呈祥”“阴阳协调”的和谐思想完美展现，是汉玉中不可多得的珍品。", "config_id": 42, "text_source_table": "Collection", "text_resource_version": 1088}, {"id": "collection_8_png", "category": "特产", "label": "特产 collection_8", "official_name": "米花糖", "description": "成都街头的常见小吃 散发着白糖和糯米被炒热的香气", "location": "西南地区", "annotation_source": "static_config", "ownership": "obtained", "image_path": "media/resource-catalog/images/f2da0b0f92e2db1d83bf8e2f787609927312a85212f044b70dff165d65b409ac.png", "width": 250, "height": 250, "hidden_reason": null, "resource_key": "collection_8_png", "resource_version": 1073, "source_image": "media/resource-catalog/raw/41e299b6f995eb06409a7c403a1ab234dfd684c6bd11a76d6a5a93afcd50fd6c.png", "source_index": "media/resource-catalog/raw/1570fddac18d91e86543646a60c2c7 .json", "source_frame": {"x": 1739, "y": 653, "w": 222, "h": 195, "hw": 111, "hh": 97.5, "offX": 14, "offY": 24, "sourceW": 250, "sourceH": 250}, "linked_photos": [], "source_category": "图鉴", "ownership_source": "user_screenshots_and_confirmation_2026-09-09", "previous_text_annotation": {"official_name": null, "description": null, "location": null, "annotation_source": null}, "extended_description": "", "config_id": 20, "text_source_table": "Collection", "text_resource_version": 1088}, {"id": "collection_1001_png", "category": "纪念品", "label": "纪念品 collection_1001", "official_name": "伏鸟双尾青铜虎", "description": "蓄势扑食的老虎形态威武 背部屹立的小鸟神情自若", "location": "江西省博物馆", "annotation_source": "static_config", "ownership": "not_obtained", "image_path": "media/resource-catalog/images/0325e75682ceb7888368a810f121efb68d649340b0011e5d55fb5fab38e90112.png", "width": 250, "height": 250, "hidden_reason": null, "resource_key": "collection_1001_png", "resource_version": 1073, "source_image": "media/resource-catalog/raw/41e299b6f995eb06409a7c403a1ab234dfd684c6bd11a76d6a5a93afcd50fd6c.png", "source_index": "media/resource-catalog/raw/1570fddac18d91e86543646a60c2c772811b5a764fd570e8ba4f7d3f5fae0dbc.json", "source_frame": {"x": 1509, "y": 921, "w": 221, "h": 176, "hw": 110.5, "hh": 88, "offX": 15, "offY": 37, "sourceW": 250, "sourceH": 250}, "linked_photos": [{"sha256": "5f5adaa2eb17467415c4bea0d55b618689f61d91c213c22463060cc0e8908df3", "label": "江西省博物馆 · 收藏分享", "evidence": "visual_comparison_of_share_image_and_sprite"}], "source_category": "图鉴", "ownership_source": "user_screenshots_and_confirmation_2026-09-09", "previous_text_annotation": {"official_name": null, "description": null, "location": "江西省博物馆", "annotation_source": "visually_reviewed_share_image_text"}, "extended_description": "通长53.5、通高25.5厘米，重6.2千克\n1989年 江西省新干县大洋洲出土\n虎首平视，口张露齿，獠牙尖长，双目圆凸，眉粗横行，两耳竖张，背伏小鸟，腹部略垂，腹空无底，双尾曲卷，呈伏蹲欲纵之姿。虎身遍饰花纹，脸、腹部饰卷云纹，背部则饰云雷纹，鼻面、正脊、尾部与四腿下部饰变形鳞纹，四腿上部则为醒目的雷纹。虎形体大，造型奇特，外表透露威武、勇猛的神情，内中则藏匿诡谲、仙逸的神气。它把虎的神性和人对虎的崇尚表现到了极致。\n存世最大的先秦青铜虎，虎之王者，群虎之魂；造型奇特，神态诡异，是商代青铜艺术的辉煌之作；地域特色强烈，是新干大洋洲独特青铜文化的重要符号。", "config_id": 34, "text_source_table": "Collection", "text_resource_version": 1088}, {"id": "collection_1002_png", "category": "纪念品", "label": "纪念品 collection_1002", "official_name": "累丝金凤簪", "description": "踏云展翅的金色凤凰 美出了翩翩起舞的韵味", "location": "江西省博物馆", "annotation_source": "static_config", "ownership": "not_obtained", "image_path": "media/resource-catalog/images/4d7f51d55c55380effb5aeac67568ed057403a441265ddc26e6f5416e345fc0c.png", "width": 250, "height": 250, "hidden_reason": null, "resource_key": "collection_1002_png", "resource_version": 1073, "source_image": "media/resource-catalog/raw/41e299b6f995eb06409a7c403a1ab234dfd684c6bd11a76d6a5a93afcd50fd6c.png", "source_index": "media/resource-catalog/raw/1570fddac18d91e86543646a60c2c772811b5a764fd570e8ba4f7d3f5fae0dbc.json", "source_frame": {"x": 656, "y": 1828, "w": 195, "h": 219, "hw": 97.5, "hh": 109.5, "offX": 28, "offY": 16, "sourceW": 250, "sourceH": 250}, "linked_photos": [], "source_category": "图鉴", "ownership_source": "user_screenshots_and_confirmation_2026-09-09", "previous_text_annotation": {"official_name": null, "description": null, "location": null, "annotation_source": null}, "extended_description": "通长22.5、凤长7.5、高7.8厘米，重150.5克\n1972年 江西省南城县益端王墓王妃彭氏棺出土\n金簪作凤形，除凤头用金片成型外，全身都采用累丝法制成，玲珑剔透。金凤展翅挺胸，足踏祥云，颈、胸、腹、腿等部分的外表用细如发丝的金线制成长长的羽毛，排列整齐。硕大美丽的五根尾羽从体后回旋向上翻卷，及于头部，成为金凤的主要部分之一，使凤鸟隽雅秀美的凤尾具有一种节奏感和韵律美。脚趾有力地抓于用金丝累织而成的云形体上。云体下为簪足，簪脚上分别錾刻“银作局永乐贰拾贰年拾月内成造玖成色金贰两外焊贰分”24字铭文。\n簪脚錾刻铭文，表明金簪是内府银作局所制，为皇家出品；采用了捶压、累丝等工艺，纤细秀丽、巧夺天工，极为精致，堪称皇家金银器工艺成就的代表之作；为明代益藩端王妃所使用，制作年代明确，物主清晰。", "config_id": 35, "text_source_table": "Collection", "text_resource_version": 1088}, {"id": "collection_32_png", "category": "特产", "label": "特产 collection_32", "official_name": "鸡蛋仔", "description": "风靡香港的街头小吃 外脆内软的烤鸡蛋饼", "location": "港澳地区", "annotation_source": "static_config", "ownership": "obtained", "image_path": "media/resource-catalog/images/07ba4e7e6fd4acc9795347503eccaa662ba8be X": 16, "offY": 24, "sourceW": 250, "sourceH": 250}, "linked_photos": [], "source_category": "图鉴", "ownership_source": "user_screenshots_and_confirmation_2026-09-09", "previous_text_annotation": {"official_name": null, "description": null, "location": null, "annotation_source": null}, "extended_description": "高20-26厘米\n北魏 山西省大同市曹夫楼村出土\n由7件胡人俑组成，均为深目高鼻的胡人。一件俑伫立仰首，额正中有圆孔，头顶长杆，上有两个儿童正在做惊险表演，这种杂技叫缘橦。其余六件神态各异。", "config_id": 50, "text_source_table": "Collection", "text_resource_version": 1088}, {"id": "collection_1004_png", "category": "纪念品", "label": "纪念品 collection_1004", "official_name": "活环屈蹲羽人玉佩饰", "description": "屈膝蹲坐的羽人 形成了岁月雕琢的玉器", "location": "江西省博物馆", "annotation_source": "static_config", "ownership": "not_obtained", "image_path": "media/resource-catalog/images/7be18265d772b045617a0fe2b8dad6b04786e85078e3fe262dc8dfd43d9c6bc2.png", "width": 250, "height": 250, "hidden_reason": null, "resource_key": "collection_1004_png", "resource_version": 1073, "source_image": "media/resource-catalog/raw/41e299b6f995eb06409a7c403a1ab234dfd684c6bd11a76d6a5a93afcd50fd6c.png", "source_index": "media/resource-catalog/raw/1570fddac18d91e86543646a60c2c772811b5a764fd570e8ba4f7d3f5fae0dbc.json", "source_frame": {"x": 749, "y": 1579, "w": 145, "h": 219, "hw": 72.5, "hh": 109.5, "offX": 62, "offY": 17, "sourceW": 250, "sourceH": 250}, "linked_photos": [], "source_category": "图鉴", "ownership_source": "user_screenshots_and_confirmation_2026-09-09", "previous_text_annotation": {"official_name": null, "description": null, "location": null, "annotation_source": null}, "extended_description": "通高11.1、身高8.4、厚1.5厘米\n1989年 江西省新干县大洋洲出土\n佩饰。叶腊石类质，色呈枣红。羽人造型，作侧身屈臂蹲坐。首如鸟形，圆眼粗眉，长勾鼻作喙状，嘴微微张口，“C”形大耳，顶上扉棱状的高凸冠，顶后部连系三个相套环形成的短链。身亦人亦鸟，体形如人，两臂屈于胸前，拳紧紧握住，拳心朝内，双膝弯曲蹲坐。身体两侧各雕一翼，脊背雕刻层叠的羽纹。这是迄今为止发现的唯一的商代羽人玉佩饰，具有神人意味，人、兽、鸟集于一身，想象丰富，琢制巧妙。\n造型神秘，亦人亦鸟，是迄今发现最早的玉“羽人”。\n因材设计，制作巧妙，掏雕高超，三环相扣，是最早的活链玉器。\n内涵丰富，文化独特，是南方地区远古土著民族鸟图腾崇拜的遗俗和变异，在中国玉器史上有着崇高的地位。", "config_id": 37, "text_source_table": "Collection", "text_resource_vers  "source_image": "media/resource-catalog/raw/41e299b6f995eb06409a7c403a1ab234dfd684c6bd11a76d6a5a93afcd50fd6c.png", "source_index": "media/resource-catalog/raw/1570fddac18d91e86543646a60c2c772811b5a764fd570e8ba4f7d3f5fae0dbc.json", "source_frame": {"x": 853, "y": 1800, "w": 215, "h": 215, "hw": 107.5, "hh": 107.5, "offX": 18, "offY": 19, "sourceW": 250, "sourceH": 250}, "linked_photos": [], "source_category": "图鉴", "ownership_source": "user_screenshots_and_confirmation_2026-09-09", "previous_text_annotation": {"official_name": null, "description": null, "location": null, "annotation_source": null}, "extended_description": "外径32.8厘米、孔径11.6厘米、厚0.6厘米\n1977年 山东曲阜鲁国故城乙组52号墓出土\n大玉璧。玉料呈青碧色，玉质晶莹温润，半透明，油脂光泽。玉璧肉部内、外缘各有一周廓，肉两面纹饰相同，以两组微凸起的绹索纹分隔成内、中、外三层纹饰。内、外两层为阴线刻纹，中间以斜向交叉排列的蒲纹为地，其间浅浮雕饰排列均匀的谷纹；内层为合首双身龙纹，其间以三道绹索纹相隔成三组；外层为五组合首双身龙纹，每组龙尾两两相交，纹饰布局紧密匀称，繁缛精美，线条流畅，工艺纯熟，属战国玉璧中的精品，也是战国玉璧中形制最大的一件。", "config_id": 40, "text_source_table": "Collection", "text_resource_version": 1088}, {"id": "collection_44_png", "category": "纪念品", "label": "纪念品 collection_44", "official_name": "玩具车", "description": "港味十足的双层巴士模型 是繁华都市的历史缩影", "location": "港澳地区", "annotation_source": "static_config", "ownership": "obtained", "image_path": "media/resource-catalog/images/8b7220f7d66965a09f027e42ded64a5545f04b1846ed116a6b72c0d9b5f83e56.png", "width": 250, "height": 250, "hidden_reason": null, "resource_key": "collection_44_png", "resource_version": 1073, "source_image": "media/resource-catalog/raw/41e299b6f995eb06409a7c403a1ab234dfd684c6bd11a76d6a5a93afcd50fd6c.png", "source_index": "media/resource-catalog/raw/1570fddac18d91e86543646a60c2c772811b5a764fd570e8ba4f7d3f5fae0dbc.json", "source_frame": {"x": 1673, "y": 1219, "w": 217, "h": 187, "hw": 108.5, "hh": 93.5, "offX": 17, "offY": 38, "sourceW": 250, "sourceH": 250}, "linked_photos": [], "source_category": "图鉴", "ownership_source": "user_screenshots_and_confirmation_2026-09-09", "previous_text_annotation": {"official_name": null, "description": null, "location": c.json", "source_frame": {"x": 1270, "y": 1302, "w": 179, "h": 205, "hw": 89.5, "hh": 102.5, "offX": 36, "offY": 23, "sourceW": 250, "sourceH": 250}, "linked_photos": [], "source_category": "图鉴", "ownership_source": "user_screenshots_and_confirmation_2026-09-09", "previous_text_annotation": {"official_name": null, "description": null, "location": null, "annotation_source": null}, "extended_description": "通高21.8、通长22.3、体宽14.5、足高7.9-8.4厘米\n1959年 山东泰安大汶口遗址出土\n酒器。夹砂红陶，通体磨光，圆面耸耳，遍施红色陶衣，光润亮泽。拱鼻，张口，鼓腹，四足，短尾上翘，耳穿小孔，背装弧形提手，尾根部一筒形注水口，可受水，嘴可出水，体肥壮，腹部鼓起加大了容积，四足立起便于加热，造型生动美观，近似猪或狗形。\n全器构思巧妙，即是使用器，又不失艺术情趣，准确的把握了动物各部位的比例结构和体形特征，表现出大汶口先民们高超的制陶水平。", "config_id": 38, "text_source_table": "Collection", "text_resource_version": 1088}, {"id": "collection_1033_png", "category": "纪念品", "label": "纪念品 collection_1033", "official_name": "双鸾瑞兽纹铜镜", "description": "绕过有花纹的镜子背面 蛙脸清晰可见", "location": "吴文化博物馆", "annotation_source": "static_config", "ownership": "not_obtained", "image_path": "media/resource-catalog/images/a9f388730456460cf09fd457b272da4b92629fba5ec59d036efb3cb452da0ce4.png", "width": 250, "height": 250, "hidden_reason": null, "resource_key": "collection_1033_png", "resource_version": 1073, "source_image": "media/resource-catalog/raw/41e299b6f995eb06409a7c403a1ab234dfd684c6bd11a76d6a5a93afcd50fd6c.png", "source_index": "media/resource-catalog/raw/1570fddac18d91e86543646a60c2c772811b5a764fd570e8ba4f7d3f5fae0dbc.json", "source_frame": {"x": 1236, "y": 1522, "w": 214, "h": 213, "hw": 107, "hh": 106.5, "offX": 18, "offY": 19, "sourceW": 250, "sourceH": 250}, "linked_photos": [], "source_category": "图鉴", "ownership_source": "user_screenshots_and_confirmation_2026-09-09", "previous_text_annotation": {"official_name": null, "description": null, "location": null, "annotation_source": null}, "extended_description": "高0.9厘米、直径26.8厘米，重3525克\n唐代\n铜镜是以铜锡合金为原料铸造，镜面光素用以照容，镜背装饰花纹或铭文。该镜呈八瓣菱花形，镜背分三层纹饰布局，镜背中央伏卧一兽，腹下有一孔，形成镜纽。内切圆将纹饰分为内外两区，外区分饰八组飞鸟、蝴蝶和花草纹，内区饰双鸾双兽，间饰缠枝莲纹。鸾鸟瑞兽纹铜镜是盛唐时期最流行的镜类，从纪年镜的资料中可知，大约成镜于武则天长寿年间，菱花镜也始铸于这一时期。此镜中鸾鸟、瑞兽和花鸟线条简练流畅，鸟羽细腻分明，是唐镜中的精品。", "config_id": 48, "text_source_table": "Collection", "text_resource_version": 1088}, {"id": "collection_29_png", "category": "特产", "label": "特产 collection_29", "official_name": "李广杏", "description": "色泽鲜亮滋味酸甜的敦煌杏 传说与历史上的名将军有关", "location": "西北地区", "annotation_source": "static_config", "ownership": "obtained", "image_path": "media/resource-catalog/images/052585f46637c795a7ffbc425d63c3146a16f516e7888664482b92da25b16215.png", "width": 250, "height": 250, "hidden_reason": null, "resource_key": "collection_29_png", "resource_version": 1073, "source_image": "media/resource-catalog/raw/41e299b6f995eb06409a7c403a1ab234dfd684c6bd11a76d6a5a93afcd50fd6c.png", "source_index": "media/resource-catalog/raw/1570fddac18d91e86543646a60c2c772811b5a764fd570e8ba4f7d3f5fae0dbc.json", "source_frame": {"x": 896, "y": 1525, "w": 188, "h": 187, "hw": 94, "hh": 93.5, "offX": 38, "offY": 41, "sourceW": 250, "sourceH": 250}, "linked_photos": [], "source_category": "图鉴", "ownership_source": "user_screenshots_and_confirmation_2026-09-09", "previous_text_annotation": {"official_name": null, "description": null, "location": null, "annotation_source": null}, "extended_description": "", "config_id": 3018, "text_source_table": "Item + Specialty", "text_resource_version": 1088}, {"id": "collection_69_png", "category": "纪念品", "label": "纪念品 collection_69", "official_name": "兔年窗花", "description": "兔年限定款 蛙蛙友情出镜送福", "location": "华北地区", "annotation_source": "static_config", "ownership": "obtained", "image_path": "media/resource-catalog/images/a2b0425dfc2db0a7e3d11bfa153fa8e19a2f245cc38330469ceb3d067d2928b3.png", "width": 250, "height": 250, "hidden_reason": null, "resource_key": "collection_69_png", "resource_version": 1073, "source_image": "media/resource-catalog/raw/41e299b6f995eb06409a7c403a1ab234dfd684c6bd11a76d6a5a93afcd50fd6c.png", "source_index": "media/resource-catalog/raw/1570fddac18d91e86543646a60c2c772811b5a764fd570e8ba4f7d3f5fae0dbc.json", "s     ['SHA-256', item.sha256 || (sourceFile && sourceFile.sha256) || '未取得']]) {

  }
  info.append(fields);
  if (item.extended_description) {
    const extra = node('details');
    extra.append(node('summary', '详细介绍'), node('p', item.extended_description, 'catalog-desc'));
    info.append(extra);
  }
  if (item.source_image) info.append(anchor('原始图集', assetUrl(item.source_image)));
  if (item.source_index) info.append(anchor('裁切坐标 JSON', assetUrl(item.source_index)));
  if (item.source_catalog) info.append(anchor('藏品资料', assetUrl(item.source_catalog)));
  if (item.linked_photos.length) {
    info.append(node('h3', '关联分享图'));
    for (const photo of item.linked_photos) {
      const link = anchor(photo.label, (embedded ? '' : 'index.html') + '#photo-' + photo.sha256);
      if (embedded) link.onclick = event => {
        event.preventDefault();
        get('resource-dialog').close();
        window.openPhotoBySha(photo.sha256);
      };
      info.append(link);
    }
    info.append(node('p', '图像对应关系已核对；分享图不代表当前仍持有该物品。', 'muted'));
  }
  if (!get('resource-dialog').open) get('resource-dialog').showModal();
  history.replaceState(null, '', '#resource-' + encodeURIComponent(item.id));
  info.scrollTop = 0;
}
document.querySelectorAll('.catalog-categories [data-category]').forEach(button => {
  button.onclick = () => {
    category = button.dataset.category;
    bookCategory = category;
    get('catalog-search').value = '';
    get('catalog-ownership').value = '';
    get('catalog-linked').checked = false;
    history.replaceState(null, '', routes[category]);
    render();
  };
});
get('catalog-search').oninput = render;
get('catalog-ownership').onchange = render;
get('catalog-linked').onchange = render;
get('resource-prev').onclick = () => show(current - 1);
get('resource-next').onclick = () => show(current + 1);
get('resource-close').onclick = () => get('resource-dialog').close();
get('resource-dialog').addEventListener('close', () => {
  if (location.hash.startsWith('#resource-')) history.replaceState(null, '', routes[category]);
});
get('resource-dialog').addEventListener('keydown', event => {
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') { event.preventDefault(); show(current + (event.key === 'ArrowLeft' ? -1 : 1)); }
});
function openResource(id) {
  id = (catalog.aliases || {})[id] || id;
  const item = allItems.find(item => item.id === id);
  if (!item) return;
  const next = item.category === '物品' ? 'items' : item.category === '家具' ? 'furniture' : 'resources';
  if (next === 'resources') bookCategory = item.category;
  if (embedded) selectView(next);
  else selectSection(next);
  get('catalog-search').value = '';
  get('catalog-linked').checked = false;
  get('catalog-ownership').value = '';
  render();
  const index = visible.findIndex(item => item.id === id);
  if (index >= 0) show(index);
}
window.openCatalogResource = openResource;
function selectSection(next) {
  if (section !== next) {
    get('catalog-search').value = '';
    get('catalog-ownership').value = '';
    get('catalog-linked').checked = false;
  }
  section = next;
  category = section === 'resources' ? bookCategory : sections[section];
  render();
}
window.selectCatalogSection = selectSection;
function openHash() {
  const hash = location.hash.replace('#view-', '#');
  if (['#resources', '#resources-specialties', '#resources-gifts', '#items', '#furniture'].includes(hash)) {
    if (hash === '#resources-specialties') bookCategory = '特产';
    if (hash === '#resources-gifts') bookCategory = '藏品';
    if (hash === '#resources') bookCategory = '纪念品';
    const next = hash.startsWith('#resources') ? 'resources' : hash.slice(1);
    if (embedded) selectView(next); else selectSection(next);
  }
  if (location.hash.startsWith('#resource-')) openResource(decodeURIComponent(location.hash.slice(10)));
}
render();
window.addEventListener('hashchange', openHash);
openHash();
})();
</script></body></html>
